version: '3.8'
services:
  mysql-container:
    image: mysql:8.0.21
    container_name: mysql-container
    environment:
      MYSQL_DATABASE: uces
      MYSQL_ROOT_PASSWORD: root
      LANG: en_US.UTF-8
    ports:
      - "3308:3306"
    volumes:
      - ./src/main/java/com/example/UCESAPI/db/init.sql:/docker-entrypoint-initdb.d/init.sql
    networks:
      - app-network

  spring-boot-container:
    container_name: spring-boot-container
    ports:
      - "8081:8080"
    environment:
      SPRING_DATASOURCE_URL: jdbc:mysql://mysql-container:3306/uces?serverTimezone=GMT-3
      SPRING_DATASOURCE_USERNAME: root
      SPRING_DATASOURCE_PASSWORD: root
      JWT_SECRET_KEY: utn_secu
      CORS_ALLOWED_ORIGINS: http://angular-container:4201
    build:
      context: .
    links:
      - mysql-container
    depends_on:
      - mysql-container
    restart: always
    networks:
      - app-network

  angular-container:
    container_name: angular-container
    build:
      context: C:\xampp\htdocs\AvanzadaII\Angular\UCES-WEB-PAGE  # Ruta relativa al proyecto Angular
    ports:
      - "4201:80"
    links:
      - spring-boot-container
    networks:
      - app-network

networks:
  app-network:
    driver: bridge